[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-design-mcp"
version = "1.0.0"
description = "Award-winning AI Design MCP Server — screenshot analysis, fintech UI generation, design system detection, and adoption briefs for Claude Opus 4.6"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI Design Studio"}
]

dependencies = [
    "anthropic>=0.42.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0",
    "cssutils>=2.9.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
ai-design-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
